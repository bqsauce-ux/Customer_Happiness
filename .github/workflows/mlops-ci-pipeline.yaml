name: MLOps Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - main

jobs:
  data-processing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process data
        run: |
          python src/data/Preprocessing.py 
          
      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/ACME-HappinessSurvey2020.csv

  model-training:
    needs: data-processing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/

      - name: Set up MLflow
        run: |
          docker pull ghcr.io/mlflow/mlflow:latest
          docker run -d \
            -p 5555:5000 \
            --name mlflow-server \
            ghcr.io/mlflow/mlflow:latest \
            mlflow server \
            --host 0.0.0.0 \
            --backend-store-uri sqlite:///mlflow.db

      - name: Wait for MLflow to start
        run: |
          for i in {1..10}; do
            curl -f http://localhost:5555/health && exit 0
            sleep 5
          done
          exit 1

      - name: Train model
        run: |
          mkdir -p models
          python src/models/Training_model.py

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: src/models/model_config.yaml

      - name: Upload best trained model
        uses: actions/upload-artifact@v4
        with:
          name: best-trained-model
          path: src/models/best_model.joblib

      - name: Clean up MLflow
        run: |
          docker stop mlflow-server || true
          docker rm mlflow-server || true

  build-and-publish:
    needs: model-training
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: src/models/

      - name: Download best trained model
        uses: actions/download-artifact@v4
        with:
          name: best-trained-model
          path: src/models/
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: marlesque
          password: dckr_pat_A5jCb58_bPBowr98d-klo0w6aEQ

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: docker.io/marlesque/customer-happiness:latest
  
  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }} 
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

          git clone https://user:${HF_TOKEN}@huggingface.co/spaces/marlesque/customer-happiness hf-space

          rsync -av --exclude='.git' . hf-space/

          cd hf-space

          git add .
          git commit -m "Auto deploy from GitHub Actions" || echo "No changes"

          git push
