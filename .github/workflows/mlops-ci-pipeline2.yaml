name: MLops CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
        - main
jobs:
  e2e_workflow:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.5'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Data Processing Tests
        run: |    
          python src/data/Preprocessing.py
      
      - name: Setup MLflow
        run: |
          docker pull ghcr.io/mlflow/mlflow:latest
          docker run -d -p 5000:5000 --name mlflow-server ghcr.io/mlflow/mlflow:latest mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /tmp/mlruns
      - name: Train the model
        run: | 
          python src/models/Training_model.py 
      - name: Cleaning up MLflow
        run: |
          docker stop mlflow-server
          docker rm mlflow-server
          docker rmi ghcr.io/mlflow/mlflow:latest
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: marlesque
          password: dckr_pat_A5jCb58_bPBowr98d-klo0w6aEQ
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: marlesque/fastapi:${{ github.sha}}
          context: "."
          file: "Dockerfile"
